<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#3d8bfd">
  <title>Our Chat</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Sign in -->
  <main id="login" class="screen hidden">
    <form id="loginForm" class="card" autocomplete="off">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="url(#g)"/>
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d8bfd"/><stop offset="1" stop-color="#7a5cff"/></linearGradient></defs>
        <path d="M18 20h28a6 6 0 0 1 6 6v12a6 6 0 0 1-6 6H33l-9 7v-7h-6a6 6 0 0 1-6-6V26a6 6 0 0 1 6-6z" fill="#fff"/>
      </svg>
      <h1>Private chat</h1>
      <p class="sub">Just for two. Pick a room name and password, then share them with the other person.</p>

      <label>Your name
        <input id="name" maxlength="24" required autocapitalize="words" placeholder="e.g. Nikki">
      </label>
      <label>Room name
        <input id="room" maxlength="40" required autocapitalize="off" placeholder="e.g. our-little-room">
      </label>
      <label>Password
        <input id="password" type="password" minlength="6" maxlength="100" required placeholder="At least 6 characters" autocomplete="current-password">
      </label>

      <button type="submit" id="joinBtn" class="primary">Enter chat</button>
      <p id="loginError" class="error" role="alert"></p>
    </form>
  </main>

  <!-- Conversation -->
  <section id="chat" class="chat hidden">
    <header class="bar">
      <div id="peerAvatar" class="avatar" aria-hidden="true">…</div>
      <div class="who">
        <div id="peerName" class="name">Connecting…</div>
        <div id="peerStatus" class="status"></div>
      </div>
      <button id="logoutBtn" class="icon" type="button" aria-label="Sign out" title="Sign out">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </header>

    <div id="banner" class="banner hidden" role="status"></div>

    <div id="messages" class="messages" aria-live="polite"></div>

    <button id="toBottom" class="to-bottom hidden" type="button" aria-label="Jump to latest message">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      <span id="unreadCount" class="badge"></span>
    </button>

    <form id="composer" class="composer">
      <textarea id="input" rows="1" maxlength="4000" placeholder="Message" aria-label="Message" enterkeyhint="send"></textarea>
      <button id="sendBtn" class="send" type="submit" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6l-.1 6.5L15 12 3.3 13.9z"/></svg>
      </button>
    </form>
  </section>

  <div id="toast" class="toast" role="status"></div>

  <script src="/app.js"></script>
</body>
</html>
